[package]
name = "mirror"
version = "0.1.0-alpha.3"
description = "A clean, offline video player"
authors = ["Mirror"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "mirror_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2.4"
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fontdb = "0.24.0"

# The updater is desktop-only, so it is not pulled in for other targets.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.11"

# macOS paints its three window buttons itself, as AppKit views over Mirror's
# own titlebar. Hiding them with the bar means reaching those views, so the
# bindings tao already builds against are declared here too.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSAnimation",
  "NSAnimationContext",
  "NSButton",
  "NSControl",
  "NSResponder",
  "NSView",
  "NSWindow",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
