[package]
name = "mirror"
version = "0.1.0-alpha.5"
description = "A clean, offline video player"
authors = ["Mirror"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "mirror_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.4"
# The About section's repository link is an ordinary `<a target="_blank">`; the
# plugin is what turns that click into the system browser instead of a new
# webview, and `opener:default` in the capability is what lets it.
tauri-plugin-opener = "2.5"
window-vibrancy = "0.6"
# The `media` protocol decodes the file path out of its URL (see `media.rs`).
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
# Not referenced in src/, but required: tauri::generate_context! expands to
# code that names `serde_json` at the crate root (the plugin configs).
serde_json = "1"
fontdb = "0.24.0"

# Both are desktop-only, so they are not pulled in for other targets.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.11"
# A file handed to Mirror is handed to the window that is already open rather
# than to a second copy of the app.
tauri-plugin-single-instance = "2.4"

# macOS paints its three window buttons itself, as AppKit views over Mirror's
# own titlebar. Hiding them with the bar means reaching those views, so the
# bindings tao already builds against are declared here too.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSAnimation",
  "NSAnimationContext",
  "NSButton",
  "NSControl",
  "NSResponder",
  "NSView",
  "NSWindow",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
