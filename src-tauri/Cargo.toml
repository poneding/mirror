[package]
name = "mirror"
version = "0.1.0-alpha.1"
description = "A clean, offline video player"
authors = ["Mirror"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "mirror_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.4"
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The updater is desktop-only, so it is not pulled in for other targets.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.11"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
