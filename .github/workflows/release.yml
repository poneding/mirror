# Publishing pipeline. Pushing a version tag is the release — the workflow
# creates the GitHub release as well, so there is nothing to click; pushes to
# main never publish anything.
#
#   changelog  turns the release tag into the app version, creates the release
#              and writes the git-cliff changelog into its body. That body is
#              also the `notes` field the updater serves to installed apps, so
#              the in-app update notice shows the same text.
#   build      builds, signs and attaches the desktop bundles for every
#              platform, plus latest.json for the updater.
#
# One-time setup is in README.md (signing key + TAURI_SIGNING_PRIVATE_KEY
# repository secret).

name: Release

on:
  push:
    tags: ['v*']
  # Kept for releases published by hand — that is how a tag pushed before this
  # trigger existed still gets released, and how a failed run is redone. The
  # release this workflow creates itself is made with the repository token, and
  # token-made events do not start workflows, so the paths cannot double up.
  release:
    types: [published]

permissions:
  contents: write

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      changelog: ${{ steps.cliff.outputs.content }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          # git-cliff walks the tagged history, so it wants every commit and tag.
          fetch-depth: 0

      - name: Check the tag is SemVer
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not SemVer. Push version tags as v1.2.3, or v1.2.3-rc.1 for a prerelease."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Generate the changelog
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          # --current: the commits belonging to the tag being released. It fails
          # loudly if that tag is not the newest one reachable from the checkout
          # (re-running an old release after a newer one exists) rather than
          # silently writing another release's notes into the body.
          args: --current
        env:
          OUTPUT: CHANGELOG.md

      - name: Create or update the release with the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          # GitHub's *prerelease* flag hides a release from /releases/latest, the
          # URL the updater reads, so while no stable release exists to be
          # "latest" a flagged prerelease breaks every update check. Flag a
          # SemVer prerelease tag only once a stable tag already has a release.
          prerelease=false
          if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            if gh release list --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' \
              | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$' >/dev/null; then
              prerelease=true
            fi
          fi

          # The tag push creates the release; a release published by hand is
          # already there, and gets its body (and the flag) rewritten here.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file CHANGELOG.md --prerelease="$prerelease"
          else
            gh release create "$TAG" --title "Mirror $TAG" --verify-tag \
              --notes-file CHANGELOG.md --prerelease="$prerelease"
          fi

  build:
    name: Build ${{ matrix.label }}
    needs: changelog
    strategy:
      # A broken target must not cancel the others: every job uploads to the
      # same release and re-running a single job is expected.
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple silicon)
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
          - label: macOS (Intel)
            platform: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
          - label: Linux
            platform: ubuntu-22.04
            args: --bundles appimage,deb
          - label: Windows
            platform: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux webview dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Stamp the release version
        run: node scripts/set-version.mjs "${{ needs.changelog.outputs.version }}"

      - name: Build and attach the bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Signs the updater artifacts. The matching public key is
          # `plugins > updater > pubkey` in src-tauri/tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.release.tag_name || github.ref_name }}
          # The action rewrites the name and body of an existing release, so it
          # is handed back exactly what the changelog job wrote.
          releaseName: ${{ github.event.release.name || format('Mirror {0}', github.event.release.tag_name || github.ref_name) }}
          releaseBody: ${{ needs.changelog.outputs.changelog }}
          releaseDraft: false
          args: ${{ matrix.args }}
