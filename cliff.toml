# git-cliff configuration for Mirror.
#
# Releases are SemVer tags (`v1.2.3`). Commit subjects drive both the GitHub
# release body and the changelog the app shows when it finds an update, so the
# body stays plain Markdown: no HTML, no commit hashes, no external links.
#
# Group order is fixed by the `<!-- n -->` markers (git-cliff sorts groups
# alphabetically); `striptags` keeps the marker out of the rendered heading.

[changelog]
header = ""
body = """
## What's Changed
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
skip_tags = ""
ignore_tags = ""
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactor" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  # Everything else (chore, ci, style, test) is maintainer work, not a change
  # users read in the update notice.
  { message = ".*", skip = true },
]
